services:
  platinumeye:
    build: .
    container_name: platinumeye
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5173"
      STATS_FILE: /data/stats.json
    ports:
      - "5173:5173"
    volumes:
      - ./data:/data
    networks:
      - default
      - twenty_default

networks:
  twenty_default:
    external: true
